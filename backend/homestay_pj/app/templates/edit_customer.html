<h1>編輯客戶資料</h1>

<form method="POST">
    <p>
        <label>姓名：</label>
        <input type="text" name="customer_name" value="{{ customer[1] }}" required>
    </p>
    <p>
        <label>電話：</label>
        <input type="text" name="phone" value="{{ customer[2] }}" required>
    </p>
    
    <button type="submit">💾 儲存修改</button>
</form>

<br>
<a href="/customer/list">❌ 取消並返回列表</a>
