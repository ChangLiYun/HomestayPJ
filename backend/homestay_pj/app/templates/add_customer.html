<h1>新增客戶</h1>

<form method="post">

    <p>姓名</p>
    <input type="text" name="customer_name">

    <p>電話</p>
    <input type="text" name="phone">

    <p>入住日期</p>
    <input type="date" name="checkin">

    <p>退房日期</p>
    <input type="date" name="checkout">

    <p>入住人數</p>
    <input type="number" name="guest_count">

    <br><br>

    <button type="submit">
        新增客戶
    </button>

</form>
