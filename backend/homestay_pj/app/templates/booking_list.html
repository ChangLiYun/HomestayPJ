<h1>🏨 民宿訂房紀錄總覽</h1>

<table border="1">
    <tr>
        <th>訂單 ID</th>
        <th>客戶姓名</th>
        <th>安排房型</th>
        <th>入住日期</th>
        <th>退房日期</th>
        <th>入住人數</th>
        <th>操作</th>
    </tr>

    {% for booking in bookings %}
    <tr>
        <td>{{ booking[0] }}</td>
        <td>{{ booking[1] }}</td>
        <td>{{ booking[2] }}</td>
        <td>{{ booking[3] }}</td>
        <td>{{ booking[4] }}</td>
        <td>{{ booking[5] }} 人</td>
        <td>
            <!-- 新增紅色的刪除按鈕，並加上確認防手滑視窗 -->
            <a href="/booking/delete/{{ booking[0] }}" onclick="return confirm('確定要刪除這筆訂房紀錄嗎？');" style="color: red;"> 刪除</a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/booking/add">➕ 登記下一筆新訂房</a>

<a href="/">🔙 回首頁</a>
