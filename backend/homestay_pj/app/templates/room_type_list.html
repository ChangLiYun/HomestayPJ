<h1>房型列表</h1>

<table border="1">
    <tr>
        <th>房型 ID</th>
        <th>房型名稱</th>
        <th>可住人數 (人)</th>
        <th>總房間數 (間)</th>
    </tr>

    {% for room in room_types %}
    <tr>
        <!-- 這裡的欄位順序對應資料庫：RoomTypeId, RoomName, Capacity, TotalRooms -->
        <td>{{ room[0] }}</td>
        <td>{{ room[1] }}</td>
        <td>{{ room[2] }}</td>
        <td>{{ room[3] }}</td>
    </tr>
    {% endfor %}
</table>
