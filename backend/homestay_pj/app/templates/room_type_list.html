<h1>房型列表</h1>

<table border="1" style="width: 100%; max-width: 500px; border-collapse: collapse; text-align: center;">
    <tr>
        <th style="padding: 10px;">房型 ID</th>
        <th style="padding: 10px;">房型名稱</th>
        <th style="padding: 10px;">可住人數 (人)</th>
        <th style="padding: 10px;">總房間數 (間)</th>
    </tr>

    {% for room in room_types %}
    <tr>
        <!-- 這裡的欄位順序對應資料庫：RoomTypeId, RoomName, Capacity, TotalRooms -->
        <td style="padding: 8px;">{{ room[0] }}</td>
        <td style="padding: 8px;">{{ room[1] }}</td>
        <td style="padding: 8px;">{{ room[2] }}</td>
        <!-- 刪除建 -->
        <td style="padding: 8px;">{{ room[3] }}</td>
        <td style="padding: 8px;">
            <a href="/room_type/delete/{{ room[0] }}" onclick="return confirm('確定要刪除此房型嗎？');" style="color: red; text-decoration: none;"> 刪除</a>
        </td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/room_type/add">➕ 繼續新增房型</a>
