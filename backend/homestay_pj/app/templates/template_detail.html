<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>行程模板細節</title>
</head>
<body style="line-height: 1.8; padding: 20px;">

    <!-- template[1] 代表 TemplateName -->
    <h1>🗺️ 行程模板：{{ template[1] }}</h1>
    <p>以下為本模板預設的每日推薦行程：</p>

    <!-- 📊 核心行程表格開始 -->
    <table border="1" style="width: 100%; max-width: 700px; border-collapse: collapse; text-align: center;">
        <tr style="background-color: #f2f2f2;">
            <th style="padding: 10px; width: 90px;">第幾天</th>
            <th style="padding: 10px; width: 110px;">時間</th>
            <th style="padding: 10px;">行程景點內容</th>
            <th style="padding: 10px; width: 80px;">操作</th>
        </tr>

        {% if details %}
            {% for d in details %}
            <tr>
                <!-- d[1]=DayNumber, d[2]=ActivityTime, d[3]=Description -->
                <td style="padding: 8px;">第 {{ d[1] }} 天</td>
                <td style="padding: 8px;">{{ d[2] }}</td>
                <td style="padding: 8px; text-align: left;">{{ d[3] }}</td>
                
                <!-- 🗑️ 刪除按鈕，注意這裡要同時傳入模板 ID 和這筆行程的 DetailId (d[0]) -->
                <td style="padding: 8px;">
                    <a href="/template/detail/{{ template[0] }}/delete/{{ d[0] }}" onclick="return confirm('確定要刪除這段行程嗎？');" style="color: red; text-decoration: none;"> 刪除</a>
                </td>
            </tr>
            {% endfor %}
        {% else %}
            <tr>
                <td colspan="4" style="padding: 15px; color: gray;">目前此模板尚未建立任何行程細節。</td>
            </tr>
        {% endif %}
    </table>
    <!-- 📊 核心行程表格結束 -->


    <!-- 💡 快速追加行程細節的小表單 -->
    <hr style="max-width: 700px; margin: 30px 0; border: 0.5px solid #eee;">
    <h3>➕ 追加此模板的行程景點</h3>
    <form action="/template/detail/{{ template[0] }}/add" method="POST" style="max-width: 700px; line-height: 1.8;">
        <p>
            <label>第幾天：</label>
            <input type="number" name="day_number" value="1" min="1" style="width: 50px; padding: 5px;" required>
            
            <label style="margin-left: 20px;">活動時間：</label>
            <input type="text" name="activity_time" placeholder="例如：12:00 或 下午" style="width: 120px; padding: 5px;" required>
        </p>
        <p>
            <label style="vertical-align: top;">景點行程描述：</label>
            <textarea name="description" rows="2" style="width: 75%; padding: 5px;" placeholder="例如：前往馬公市區享用在地仙人掌冰" required></textarea>
        </p>
        <p>
            <button type="submit" style="padding: 6px 12px; cursor: pointer;"> 追加至本行程</button>
        </p>
    </form>


    <!-- 🔙 返回按鈕區區 -->
    <br>
    <a href="/template/list"> 返回模板總覽</a>
    <br><br>
    <a href="/"> 回系統首頁</a>

</body>
</html>
